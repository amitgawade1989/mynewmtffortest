# ------------------------------------------------------------------
# Document Comparison Evaluation Pipeline - configuration
# All paths are relative to the project root.
# ------------------------------------------------------------------

paths:
  processed_dir: data/processed     # Phase 0 output (chunks)
  outputs_dir: outputs              # later phases: runs, reports

# Any two (or more) documents can be listed here.
# `id` is an internal code used only in chunk IDs / metadata - it is
# never shown in generated questions. Supported: .pdf, .docx, .txt, .md
documents:
  - id: D1
    label: UK Handbook
    path: Meridian_HR_Handbook_UK.pdf
  - id: D2
    label: India Handbook
    path: Meridian_HR_Handbook_India.pdf

# ---------------- Models ---------------------------------------------
# provider: google (key in .env: GOOGLE_API_KEY) or openai (key in .env: OPENAI_API_KEY)
# generator = builds the dataset (Phases 1-2); under_test = answers in the RAG (Phase 3);
# judge = LLM judge (Phase 4). Keep under_test different from generator and judge.
models:
  provider: openai
  temperature: 0
  seed: 42                          # fixed seed for the model under test (repeatability)
  # Embeddings for EVERYTHING (chunks, retrieval, alignment, metrics). Local model, 384 dims, no API.
  # A local folder path also works (e.g. C:/models/all-MiniLM-L6-v2) for machines without internet.
  embeddings: sentence-transformers/all-MiniLM-L6-v2
  google:                           # free-tier key: 20 requests/day/model - too low for a full run
    generator: gemini-3.8-flash
    under_test: gemini-3.7-flash
    judge: gemini-3.8-flash
  openai:                           # Phase 1 output was built with gpt-5.5; later phases use cheaper models
    generator: gpt-5.4-mini
    under_test: gpt-4.1-mini
    judge: gpt-5.4-mini

# Robustness of every LLM / embedding call
llm:
  min_interval_s: 0.5               # pause between calls (raise to ~4 on a free-tier key)
  max_attempts: 6                   # retries with exponential backoff
  timeout_s: 90                     # per-request timeout; a stalled call is retried instead of waited on

# ---------------- Phase 0: ingestion & parent-child chunking -------
ingestion:
  # Header/footer removal (PDF): a line near the top/bottom of the page
  # that repeats on at least this share of pages is dropped.
  header_footer_page_ratio: 0.5
  header_footer_margin: 0.12        # top/bottom 12% of page height

  # Heading detection (PDF): a line is a heading if its font size is
  # at least this many points larger than the body text size.
  heading_min_size_delta: 1.0
  heading_max_words: 20

  # The parent (section) level = the largest heading size that occurs at
  # least this many times. A title used once is not treated as a section level.
  parent_heading_min_count: 2

  extract_tables: true              # keep tables as row-aligned markdown

  # Sizes are in approximate tokens (~4 characters per token).
  parent_max_tokens: 1500           # larger sections are split into parts
  child_tokens: 120
  child_overlap_tokens: 20
  child_min_tokens: 25              # smaller text pieces (e.g. a lone heading) are merged into a neighbour

# ---------------- Phase 1: topic alignment & fact pairs ------------
alignment:
  doc_a: D1                         # the two documents to compare (ids from `documents`)
  doc_b: D2
  section_candidates: 3             # top-k similar sections sent to the LLM for match confirmation
  section_min_similarity: 0.45      # candidates below this cosine similarity are not considered
  absence_search_k: 4               # chunks of the other document checked before calling a fact ONE_SIDED
  quote_match_threshold: 0.85       # fuzzy match needed for a quote to count as found in a chunk

# ---------------- Phase 2: golden dataset ---------------------------
golden:
  out_dir: data/golden
  questions_per_topic: 8
  cross_topic_questions: 8          # questions that combine facts from 2+ topics
  cross_topic_model: gpt-5.5        # optional stronger model for these few calls (mini kept
                                    # writing single-topic questions); empty = use generator
  max_direct_per_topic: 2           # "direct" = single-attribute comparison; the rest are harder
  max_revisions: 2                  # rewrite rounds for questions the checks/critic reject
  critic_min_score: 4               # 1-5 scale for answerable / correct / unambiguous
  exclude_pair_flags:               # fact pairs with these flags are never used as evidence
    - absence_check_quote_not_found
    - auto_added_unpaired_fact
  # Words that would reveal which document is which. Never allowed in question text.
  # (Generic patterns such as "Region 1", "R1", "page 3", "section 4", chunk IDs, file names
  #  and the document labels/ids are always blocked in code.)
  banned_terms: [UK, U.K., United Kingdom, Britain, British, England, Wales, English,
                 India, Indian, Bengaluru, Bangalore, Karnataka, London]

# ---------------- Phase 3: RAG (parent-child, one store per document) -
rag:
  vectorstore_dir: data/vectorstore # one Chroma collection per document (strict isolation)
  runs_dir: outputs/runs            # each run: outputs/runs/<run_id>/
  k_retrieve: 10                    # ranked children logged per document (for Recall/Precision@k)
  context_k: 4                      # top children per document whose parents go into the context
  max_parents_per_doc: 3            # cap on parent sections per document in the context
  ks: [1, 3, 5, 10]                 # cut-offs for retrieval metrics
  embed_section_title: true         # embed "section title + child text" (better recall)
  workers: 4                        # parallel answer generation (results still saved one by one)
  retrieval_gate:                   # retrieval-only mode fails if this is not met
    metric: child_recall@5
    min: 0.8

# ---------------- Phase 2b: reliability test suite (framework R1-R4) --------
reliability:
  out_dir: data/reliability
  seed: 7                           # sampling + perturbation seed (deterministic suite)
  paraphrase: {n_questions: 30, n_paraphrases: 3, min_similarity: 0.80}   # R1 semantic
  repeatability: {n_questions: 10, n_runs: 5}                             # R1 (optional)
  typo: {n_questions: 30, char_rate: 0.10, case_rate: 0.30, space_rate: 0.10}  # R2
  adversarial: {n_questions: 20}                                          # R2: 3 techniques each
  long_context: {n_questions: 5, lengths: [1000, 10000, 50000, 100000],
                 positions: [start, middle, end], filler_paragraphs: 40}  # R2
  format: {n_questions: 6}          # R3: 4 rules x 2 phrasings each
  constraint: {n_questions: 6}      # R3: 3 rules each
  multi_step: {n_questions: 10}     # R3: 2 phrasings each
  ambiguity: {n_questions: 12}      # R4
  insufficient_evidence: {n_questions: 12}   # R4 (optional)
  consistency_threshold: 0.80       # R1: pairwise cosine counted as "consistent" (MiniLM: same-meaning
                                    # answers score >= 0.80 in 90% of cases)
  accuracy_drop_flag: 0.05          # R2: drop > 5 percentage points flags fragility
  pass_thresholds:
    R1_semantic_consistency: 0.85
    R1_repeatability: 0.80
    R2_typo_noise: 0.95             # accuracy retained vs clean (1 - drop)
    R2_adversarial: 0.80            # held rate
    R2_long_context: 0.80
    R3_format: 0.90
    R3_constraint: 0.90
    R3_multi_step: 0.90
    R4_ambiguity: 0.70
    R4_insufficient_evidence: 0.80

# ---------------- Phase 4: evaluation (framework: Document Comparison column) ---
evaluation:
  workers: 4                        # parallel judge calls
  nli_model: cross-encoder/nli-deberta-v3-base   # deterministic NLI classifier (local)
  nli_entail_threshold: 0.5         # entailment probability needed to count as supported
  nli_contradiction_threshold: 0.9  # P5: sentence pairs above this are flagged as contradictory
  faithfulness_top_k: 3             # P6: context chunks checked per claim
  numeric_rel_tolerance: 0.01       # P1: |pred - true| <= 1% counts as a match
  # Cosine pre-filter thresholds - calibrated for all-MiniLM-L6-v2 on the golden run's judge verdicts:
  # correct answers 0.74-0.96, partially correct up to 0.945, incorrect 0.49-0.67.
  # Re-calibrate if you change the embedding model.
  semantic_thresholds: {auto_pass: 0.97, auto_fail: 0.40}    # P1 hybrid pre-filter (cosine)
  relevance_thresholds: {auto_pass: 0.90, auto_fail: 0.30}   # P2: cosine does not separate relevance -> judge decides
  optional_metrics:                 # "O" metrics in the framework for Document Comparison
    logical_coherence: true
    linguistic_quality: false
  readability_band: [30, 70]        # P5 linguistic: target Flesch reading ease
  sla: {ttft_s: 3.0, total_s: 10.0} # P7 latency SLA
  pricing_usd_per_1m_tokens:        # P7 cost - check current provider pricing
    gpt-4.1-mini: {input: 0.40, output: 1.60}
    gpt-5.4-mini: {input: 0.25, output: 2.00}
  pass_thresholds:                  # used for pass/fail in the summary / scorecard
    P1_exact: 0.80
    P1_semantic: 0.80
    P2_relevance: 0.80
    P3_completeness: 0.80
    P5_logical_coherence: 0.80
    P5_linguistic_quality: 0.70
    P6_claim_faithfulness: 0.85
    P6_citation_accuracy: 0.85
    P7_latency_sla: 0.95
    S5_fabricated_citations: 0.01   # lower is better: max share of fabricated citations

# ---------------- Phase 5: scorecard + report -----------------------
report:
  framework_file: LLM_Evaluation_Framework.xlsx
  capability_column: Document Comparison
  out_dir: outputs/reports
